  <rect x="95" y="445" width="440" height="155" rx="6" fill="#111f33" stroke="#233854" stroke-width="1" />
  <text x="110" y="470" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="bold">IS-04 Registration APIs (Failover Array):</text>
  
  <rect x="110" y="482" width="410" height="30" rx="4" fill="#0e1a2b" stroke="#059669" stroke-width="1" />
  <text x="120" y="502" fill="#10b981" font-family="monospace" font-size="11">P100 • Primary: https://reg-east.prod.tv/x-nmos/registration/v1.3</text>

  <rect x="110" y="518" width="410" height="30" rx="4" fill="#0e1a2b" stroke="#0284c7" stroke-width="1" />
  <text x="120" y="538" fill="#38bdf8" font-family="monospace" font-size="11">P200 • Secondary: https://reg-west.prod.tv/x-nmos/registration/v1.3</text>

  <rect x="110" y="554" width="410" height="30" rx="4" fill="#0e1a2b" stroke="#64748b" stroke-width="1" />
  <text x="120" y="574" fill="#94a3b8" font-family="monospace" font-size="11">P300 • Disaster Recovery: https://dr-reg.prod.tv/x-nmos/registration/v1.3</text>

