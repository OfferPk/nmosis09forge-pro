<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c14"/>
      <stop offset="100%" stop-color="#0d1726"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#132136"/>
      <stop offset="100%" stop-color="#0a121e"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="700" fill="url(#bg)" />

  <!-- Studio Frame -->
  <rect x="30" y="30" width="1140" height="640" rx="12" fill="#09111c" stroke="#1f324d" stroke-width="2" />

  <!-- Window Header -->
  <rect x="30" y="30" width="1140" height="52" rx="12" fill="#0f1a2a" />
  <circle cx="60" cy="56" r="7" fill="#ff5f56" />
  <circle cx="85" cy="56" r="7" fill="#ffbd2e" />
  <circle cx="110" cy="56" r="7" fill="#27c93f" />

  <!-- Title -->
  <text x="140" y="62" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="bold">
    🌐 NMOSIS09Forge Pro v1.0.0 — AMWA NMOS IS-09 System Discovery &amp; Node Bootstrapping Studio
  </text>
  <rect x="990" y="44" width="160" height="26" rx="6" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-width="1" />
  <text x="1005" y="62" fill="#06b6d4" font-family="monospace" font-size="12" font-weight="bold">10/10 PASS • IS-09 v1.0</text>

  <!-- Nav Tabs -->
  <rect x="50" y="102" width="1100" height="42" rx="8" fill="#0d1726" stroke="#1f324d" stroke-width="1" />
  <rect x="54" y="106" width="260" height="34" rx="6" fill="#06b6d4" fill-opacity="0.2" stroke="#06b6d4" stroke-width="1.5" />
  <text x="75" y="128" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold">1. Global Config (/global)</text>
  
  <text x="350" y="128" fill="#8ea2c0" font-family="-apple-system, sans-serif" font-size="13">2. Zero-Conf Discovery</text>
  <text x="630" y="128" fill="#8ea2c0" font-family="-apple-system, sans-serif" font-size="13">3. Node Bootstrapping Simulator</text>
  <text x="910" y="128" fill="#8ea2c0" font-family="-apple-system, sans-serif" font-size="13">4. 10-Point Normative Auditor</text>

  <!-- Main Card: Studio Dashboard -->
  <rect x="50" y="162" width="1100" height="485" rx="10" fill="url(#cardGrad)" stroke="#22334f" stroke-width="1" />

  <!-- Left Column: Global System Parameters -->
  <rect x="75" y="185" width="480" height="435" rx="8" fill="#0c1626" stroke="#1c2d46" stroke-width="1.5" />
  <text x="95" y="215" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="15" font-weight="bold">System Global Endpoint Parameters</text>
  <text x="95" y="235" fill="#64748b" font-family="monospace" font-size="11">GET /x-nmos/system/v1.0/global</text>

  <rect x="95" y="255" width="440" height="60" rx="6" fill="#111f33" stroke="#233854" stroke-width="1" />
  <text x="110" y="278" fill="#94a3b8" font-family="monospace" font-size="11">System ID (UUIDv4):</text>
  <text x="110" y="298" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold">9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d</text>

