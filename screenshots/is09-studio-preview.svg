  <rect x="580" y="185" width="545" height="435" rx="8" fill="#0c1626" stroke="#1c2d46" stroke-width="1.5" />
  <text x="600" y="215" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="15" font-weight="bold">Zero-Configuration Discovery &amp; Bootstrapping</text>
  <text x="600" y="235" fill="#64748b" font-family="monospace" font-size="11">RFC 8910 (DHCP 114) &amp; RFC 6763 (DNS-SD)</text>

  <!-- DHCP Option 114 Card -->
  <rect x="600" y="255" width="505" height="85" rx="6" fill="#111f33" stroke="#233854" stroke-width="1" />
  <text x="615" y="278" fill="#f59e0b" font-family="sans-serif" font-size="12" font-weight="bold">1. DHCP Option 114 (Captive-Portal / URL)</text>
  <text x="615" y="300" fill="#e2e8f0" font-family="monospace" font-size="11">URL: http://is09.prod.tv/x-nmos/system/v1.0</text>
  <text x="615" y="322" fill="#94a3b8" font-family="monospace" font-size="10">Hex: 72 3a 68 74 74 70 3a 2f 2f 69 73 30 39 2e 70 72 6f 64 2e 74 76 2f ...</text>

  <!-- DNS-SD Record Card -->
  <rect x="600" y="350" width="505" height="85" rx="6" fill="#111f33" stroke="#233854" stroke-width="1" />
  <text x="615" y="373" fill="#a855f7" font-family="sans-serif" font-size="12" font-weight="bold">2. DNS-SD Service Discovery (_nmos-system._tcp)</text>
  <text x="615" y="395" fill="#e2e8f0" font-family="monospace" font-size="11">PTR: _nmos-system._tcp.local. → nmos-system._nmos-system._tcp.local.</text>
  <text x="615" y="417" fill="#94a3b8" font-family="monospace" font-size="10">TXT: api_ver=v1.0,v1.1, api_proto=http, pri=100, api_selector=/global</text>

  <!-- Node Bootstrapping Progress Bar & Simulation -->
  <rect x="600" y="445" width="505" height="155" rx="6" fill="#111f33" stroke="#233854" stroke-width="1" />
  <text x="615" y="470" fill="#10b981" font-family="sans-serif" font-size="12" font-weight="bold">3. Node Bootstrapping Pipeline (Live Emulation)</text>
  
  <circle cx="630" cy="505" r="10" fill="#10b981" />
  <text x="630" y="509" fill="#000" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">✓</text>
  <text x="650" y="510" fill="#e2e8f0" font-family="sans-serif" font-size="11">DHCP Option 114 Received</text>

  <circle cx="630" cy="535" r="10" fill="#10b981" />
  <text x="630" y="539" fill="#000" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">✓</text>
  <text x="650" y="540" fill="#e2e8f0" font-family="sans-serif" font-size="11">Global Config Ingested: PTP Domain 127 locked</text>

  <circle cx="630" cy="565" r="10" fill="#10b981" />
  <text x="630" y="569" fill="#000" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">✓</text>
  <text x="650" y="570" fill="#10b981" font-family="sans-serif" font-size="11" font-weight="bold">IS-04 Node Registered to Primary Registry (P100)</text>
</svg>
