  <rect x="95" y="325" width="210" height="110" rx="6" fill="#111f33" stroke="#233854" stroke-width="1" />
  <text x="105" y="348" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="bold">IEEE 1588 / SMPTE ST 2059-2</text>
  <text x="105" y="372" fill="#e2e8f0" font-family="monospace" font-size="11">Domain: <tspan fill="#06b6d4" font-weight="bold">127</tspan></text>
  <text x="105" y="392" fill="#e2e8f0" font-family="monospace" font-size="11">Announce Log: <tspan fill="#06b6d4">-2</tspan></text>
  <text x="105" y="412" fill="#e2e8f0" font-family="monospace" font-size="11">Sync Log: <tspan fill="#06b6d4">-3 (8 sync/s)</tspan></text>

  <rect x="325" y="325" width="210" height="110" rx="6" fill="#111f33" stroke="#233854" stroke-width="1" />
  <text x="335" y="348" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="bold">Facility Syslog &amp; Telemetry</text>
  <text x="335" y="372" fill="#e2e8f0" font-family="monospace" font-size="11">Host: <tspan fill="#f59e0b">syslog.prod.tv</tspan></text>
  <text x="335" y="392" fill="#e2e8f0" font-family="monospace" font-size="11">Port: <tspan fill="#f59e0b">514 (UDP)</tspan></text>
  <text x="335" y="412" fill="#10b981" font-family="monospace" font-size="11">Status: Active Stream</text>

